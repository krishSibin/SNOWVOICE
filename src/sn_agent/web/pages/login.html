<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Help Desk sign in</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="login-wrap">
    <form class="card login" method="post" action="/login">
      <h1>IT Help Desk</h1>
      <div class="muted small">Sign in to talk to the help desk assistant, or to open the ops console.</div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="error" id="error" hidden>That email and password don't match.</div>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).has("failed")) document.getElementById("error").hidden = false;
  </script>
</body>
</html>
