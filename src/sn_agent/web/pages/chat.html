<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Help Desk</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">IT Help Desk</span>
    <span class="spacer"></span>
    <a id="opsLink" href="/ops" hidden>Ops console</a>
    <span class="who" id="who"></span>
    <form method="post" action="/logout"><button type="submit">Sign out</button></form>
  </header>

  <div class="chat-layout">
    <section class="card chat" aria-label="Conversation with the help desk assistant">
      <div class="chat-head">
        <span class="status-dot" id="dot"></span>
        <strong>Help desk assistant</strong>
        <span class="muted small" id="status">Not connected</span>
        <span class="spacer" style="flex:1"></span>
        <button id="stop" title="Stop the assistant talking (Esc)" hidden>Stop</button>
        <button id="mute" title="Mute the assistant's voice" hidden>Mute voice</button>
        <button id="newChat" title="Start over">New conversation</button>
      </div>

      <div class="messages" id="messages" aria-live="polite">
        <div class="start" id="start">
          <button class="mic" id="startVoice" aria-label="Start talking">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
          </button>
          <div><strong>Tap to talk</strong> to the assistant, or type below.</div>
          <div class="muted small">It checks how the same problem was fixed before. If that doesn't help, it raises a ticket for you.</div>
        </div>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <button class="mic" type="button" id="mic" aria-label="Turn the microphone on" title="Microphone">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
        </button>
        <input type="text" id="text" placeholder="Describe the problem..." aria-label="Message" maxlength="2000">
        <button class="primary" type="submit" id="send">Send</button>
      </form>
    </section>

    <aside class="card side">
      <h2>Your recent requests</h2>
      <ul id="history"><li class="muted">None yet.</li></ul>
    </aside>
  </div>

  <script src="/static/vendor/livekit-client-2.22.3.umd.js"></script>
  <script src="/static/chat.js"></script>
</body>
</html>
