<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops Console</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Ops console</span>
    <span class="spacer"></span>
    <a href="/chat">Open the chatbot</a>
    <span class="who" id="who"></span>
    <form method="post" action="/logout"><button type="submit">Sign out</button></form>
  </header>

  <main class="ops">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="dashboard" class="active">Dashboard</button>
      <button role="tab" data-tab="tickets">Tickets answered</button>
      <button role="tab" data-tab="conversations">Chatbot conversations</button>
    </nav>

    <section id="tab-dashboard">
      <div class="toolbar">
        <label class="small muted" for="days">Period</label>
        <select id="days">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="charts">
        <div class="card chart-card"><h3>Tickets answered by the agent, per day</h3><canvas id="chartRuns"></canvas></div>
        <div class="card chart-card"><h3>Agent confidence (0-100)</h3><canvas id="chartConfidence"></canvas></div>
        <div class="card chart-card"><h3>Agent outcomes</h3><canvas id="chartOutcomes"></canvas></div>
        <div class="card chart-card"><h3>Chatbot tickets by team</h3><canvas id="chartGroups"></canvas></div>
      </div>
    </section>

    <section id="tab-tickets" hidden>
      <div class="toolbar">
        <input type="text" id="ticketFilter" placeholder="Filter by ticket number">
        <select id="outcomeFilter"><option value="">All outcomes</option></select>
      </div>
      <div class="card"><table class="grid" id="runsTable">
        <thead><tr><th>Ticket</th><th>Answered</th><th>Outcome</th><th>Confidence</th><th>Took</th><th>Note</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>

    <section id="tab-conversations" hidden>
      <div class="card"><table class="grid" id="convTable">
        <thead><tr><th>Started</th><th>User</th><th>Channel</th><th>Issue</th><th>Result</th><th>Ticket</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>
  </main>

  <div class="drawer-bg" id="drawerBg"></div>
  <aside class="drawer" id="drawer" aria-modal="true" role="dialog">
    <button id="closeDrawer" style="float:right">Close</button>
    <div id="drawerBody"></div>
  </aside>

  <script src="/static/vendor/chart-4.5.1.umd.min.js"></script>
  <script src="/static/ops.js"></script>
</body>
</html>
